<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Checkout - EventPass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0 fw-bold">Ticket Checkout</h4>
                </div>
                <div class="card-body p-4">
                    <h5 class="fw-bold text-dark" th:text="${event.title}">Event Title</h5>
                    <p class="text-muted mb-3">
                        📍 <span th:text="${event.venue.name}">Venue</span> | 📅 <span th:text="${#temporals.format(event.eventDate, 'MMM dd, yyyy - HH:mm')}">Date</span>
                    </p>
                    <hr>

                    <!-- Promo & Quantity Configuration Form -->
                    <form th:action="@{/tickets/checkout/{id}(id=${event.id})}" method="get" class="mb-3">
                        <div class="row g-2 mb-3">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Quantity</label>
                                <select name="quantity" class="form-select" onchange="this.form.submit()">
                                    <option th:each="i : ${#numbers.sequence(1, maxSelectable)}"
                                            th:value="${i}"
                                            th:text="${i} + (${i == 1} ? ' Ticket' : ' Tickets')"
                                            th:selected="${i == quantity}"></option>
                                </select>
                                <small class="text-muted"><span th:text="${remainingCapacity}"></span> tickets available</small>
                            </div>
                            <div class="col-md-8">
                                <label class="form-label fw-semibold">Promo Code</label>
                                <div class="input-group">
                                    <input type="text" name="promoCode" th:value="${promoCode}" class="form-control" placeholder="SUMMER20">
                                    <button type="submit" class="btn btn-outline-secondary">Apply</button>
                                </div>
                            </div>
                        </div>
                    </form>

                    <!-- Promo Feedback -->
                    <div th:if="${promoMessage != null and promoValid}" class="alert alert-success py-2 mb-3" th:text="${promoMessage}"></div>
                    <div th:if="${promoMessage != null and !promoValid and !#strings.isEmpty(promoCode)}" class="alert alert-danger py-2 mb-3" th:text="${promoMessage}"></div>

                    <div class="p-3 bg-light rounded border mb-4">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Base Price (per ticket):</span>
                            <span>€<span th:text="${#numbers.formatDecimal(event.basePrice, 1, 2)}"></span></span>
                        </div>

                        <div class="d-flex justify-content-between mb-2">
                            <span>Quantity:</span>
                            <span class="fw-bold" th:text="${quantity}"></span>
                        </div>

                        <div class="d-flex justify-content-between mb-2" th:if="${promoValid and totalDiscount > 0}">
                            <span>Subtotal:</span>
                            <span class="text-muted text-decoration-line-through">€<span th:text="${#numbers.formatDecimal(totalOriginalPrice, 1, 2)}"></span></span>
                        </div>

                        <div class="d-flex justify-content-between text-success mb-2" th:if="${promoValid and totalDiscount > 0}">
                            <span>Discount Applied (<span th:text="${promoCode}"></span>):</span>
                            <span class="fw-bold">-€<span th:text="${#numbers.formatDecimal(totalDiscount, 1, 2)}"></span></span>
                        </div>

                        <div class="d-flex justify-content-between mb-2" th:if="${promoValid and totalDiscount > 0}">
                            <span>Discounted Unit Price:</span>
                            <span class="fw-semibold text-success">€<span th:text="${#numbers.formatDecimal(unitPrice, 1, 2)}"></span></span>
                        </div>

                        <hr class="my-2">

                        <div class="d-flex justify-content-between fs-5 fw-bold text-dark">
                            <span>Total Due:</span>
                            <span class="text-primary">€<span th:text="${#numbers.formatDecimal(totalPrice, 1, 2)}"></span></span>
                        </div>
                    </div>

                    <!-- Final Purchase Form -->
                    <form th:action="@{/tickets/purchase}" method="post">
                        <input type="hidden" name="eventId" th:value="${event.id}">
                        <input type="hidden" name="promoCode" th:value="${promoValid ? promoCode : ''}">
                        <input type="hidden" name="quantity" th:value="${quantity}">
                        <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">Confirm & Pay €<span th:text="${#numbers.formatDecimal(totalPrice, 1, 2)}"></span></button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
