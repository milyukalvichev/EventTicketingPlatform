<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Manage Venues - EventPass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark mb-1">Venue Directory</h2>
            <p class="text-muted">Manage stadiums, concert halls, and theaters.</p>
        </div>
        <a th:href="@{/venues/new}" class="btn btn-warning fw-semibold shadow-sm">+ Add New Venue</a>
    </div>

    <div th:if="${param.created}" class="alert alert-success">Venue created successfully!</div>
    <div th:if="${param.updated}" class="alert alert-success">Venue updated successfully!</div>
    <div th:if="${param.deleted}" class="alert alert-info">Venue deleted successfully!</div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Venue Name</th>
                    <th>City</th>
                    <th>Capacity</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${venues}">
                    <td class="fw-bold" th:text="${v.id}"></td>
                    <td class="fw-semibold text-primary" th:text="${v.name}"></td>
                    <td th:text="${v.city}"></td>
                    <td th:text="${#numbers.formatInteger(v.capacity, 0, 'POINT')} + ' seats'"></td>
                    <td class="text-end">
                        <a th:href="@{/venues/edit/{id}(id=${v.id})}" class="btn btn-sm btn-outline-warning">Edit</a>
                        <form th:action="@{/venues/delete/{id}(id=${v.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this venue?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
