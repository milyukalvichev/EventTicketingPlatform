<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Create Account - EventPass</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h3 class="fw-bold text-center mb-4">Create Account</h3>

          <div th:if="${registrationError}" class="alert alert-danger py-2" th:text="${registrationError}"></div>

          <form th:action="@{/register}" th:object="${userRegisterDTO}" method="post">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" th:field="*{username}" class="form-control" th:errorclass="is-invalid">
              <div class="invalid-feedback" th:errors="*{username}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid">
              <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" th:field="*{password}" class="form-control" th:errorclass="is-invalid">
              <div class="invalid-feedback" th:errors="*{password}"></div>
            </div>
            <div class="mb-3">
              <label class="form-label">Confirm Password</label>
              <input type="password" th:field="*{confirmPassword}" class="form-control">
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold">Sign Up</button>
          </form>
          <p class="text-center text-muted mt-3 mb-0">Already have an account? <a th:href="@{/login}">Log in</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
