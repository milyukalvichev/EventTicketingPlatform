<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Purchase Confirmed - EventPass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 p-4">
                <div class="text-success mb-3" style="font-size: 4rem;">✓</div>
                <h2 class="fw-bold text-dark mb-2">Ticket Confirmed!</h2>
                <p class="text-muted mb-4">Your booking has been registered and verified.</p>

                <div class="text-start bg-light p-3 rounded border mb-4">
                    <p class="mb-1"><strong>Ticket ID:</strong> #<span th:text="${ticket.id}"></span></p>
                    <p class="mb-1"><strong>Event:</strong> <span th:text="${ticket.event.title}"></span></p>
                    <p class="mb-1"><strong>Price Paid:</strong> €<span th:text="${#numbers.formatDecimal(ticket.finalPrice, 1, 2)}"></span></p>
                    <p class="mb-0" th:if="${ticket.promoCodeUsed}"><strong>Promo Code:</strong> <span class="badge bg-info text-dark" th:text="${ticket.promoCodeUsed}"></span></p>
                </div>

                <div class="d-grid gap-2">
                    <a th:href="@{/tickets/my-tickets}" class="btn btn-primary fw-semibold">View All My Tickets</a>
                    <a th:href="@{/events}" class="btn btn-outline-secondary">Back to Events</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
