<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Available Events - EventPass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 fw-bold text-dark">Upcoming Live Events</h1>
            <p class="text-muted">Discover and secure tickets for top music festivals, tech summits, and cultural shows.</p>
        </div>
        <div sec:authorize="hasRole('ADMIN')">
            <a th:href="@{/events/new}" class="btn btn-warning fw-semibold shadow-sm">+ Add New Event</a>
        </div>
    </div>

    <div th:if="${param.created}" class="alert alert-success alert-dismissible fade show" role="alert">
        Event was successfully created!
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="event : ${events}">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title fw-bold text-primary" th:text="${event.title}">Event Title</h5>
                    <p class="card-text text-muted mb-2">
                        📍 <span th:text="${event.venue.name}">Venue</span>, <span th:text="${event.venue.city}">City</span>
                    </p>
                    <p class="card-text text-secondary mb-3">
                        📅 <span th:text="${#temporals.format(event.eventDate, 'MMM dd, yyyy - HH:mm')}">Date</span>
                    </p>
                    <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
                        <span class="fs-5 fw-bold text-dark">€<span th:text="${#numbers.formatDecimal(event.basePrice, 1, 2)}">0.00</span></span>
                        <a th:href="@{/tickets/checkout/{id}(id=${event.id})}" class="btn btn-success fw-semibold">Book Ticket</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
