<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Promo Code - EventPass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-warning text-dark py-3">
                    <h4 class="mb-0 fw-bold">Create Promo Code</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/admin/promos/create}" th:object="${promoDTO}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Promo Code Name</label>
                            <input type="text" th:field="*{code}" class="form-control" th:errorclass="is-invalid" placeholder="e.g. FESTIVAL30">
                            <div class="invalid-feedback" th:errors="*{code}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Discount Percentage (%)</label>
                            <input type="number" step="0.01" th:field="*{discountPercentage}" class="form-control" th:errorclass="is-invalid" placeholder="e.g. 25.00">
                            <div class="invalid-feedback" th:errors="*{discountPercentage}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Expiration Date</label>
                            <input type="date" th:field="*{expirationDate}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{expirationDate}"></div>
                        </div>

                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeSwitch" checked>
                            <label class="form-check-label fw-semibold" for="activeSwitch">Active for immediate checkout</label>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/admin/promos}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-warning fw-bold px-4">Create Promo</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
