<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error - EventPass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 p-4">
                <div class="text-danger mb-3" style="font-size: 4rem;">⚠️</div>
                <h3 class="fw-bold text-dark mb-2">Something Went Wrong</h3>
                <p class="text-muted" th:text="${errorMessage != null ? errorMessage : 'The requested resource could not be found or processed.'}"></p>
                <div class="mt-4">
                    <a th:href="@{/events}" class="btn btn-primary fw-semibold">Return to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
