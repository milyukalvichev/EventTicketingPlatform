<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Promo Code Management - EventPass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark mb-1">Promotional Codes</h2>
            <p class="text-muted">Directly connected to pricing microservice (Port 8081).</p>
        </div>
        <a th:href="@{/admin/promos/new}" class="btn btn-warning fw-semibold shadow-sm">+ Add New Promo</a>
    </div>

    <div th:if="${param.created}" class="alert alert-success">Promo code published!</div>
    <div th:if="${param.updated}" class="alert alert-success">Promo code updated!</div>
    <div th:if="${param.deleted}" class="alert alert-info">Promo code removed.</div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Code</th>
                    <th>Discount</th>
                    <th>Status</th>
                    <th>Valid Until</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${promos}">
                    <td class="fw-bold" th:text="${p.id}"></td>
                    <td><span class="badge bg-primary fs-6" th:text="${p.code}"></span></td>
                    <td class="fw-bold text-success" th:text="${p.discountPercentage + '% OFF'}"></td>
                    <td>
                        <span class="badge bg-success" th:if="${p.active}">Active</span>
                        <span class="badge bg-secondary" th:if="${!p.active}">Inactive</span>
                    </td>
                    <td th:text="${p.expirationDate}"></td>
                    <td class="text-end">
                        <a th:href="@{/admin/promos/edit/{id}(id=${p.id})}" class="btn btn-sm btn-outline-warning">Edit</a>
                        <form th:action="@{/admin/promos/delete/{id}(id=${p.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this promo code?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
