<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Tickets - EventPass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <h2 class="fw-bold text-dark mb-4">My Purchased Tickets</h2>

    <div th:if="${#lists.isEmpty(tickets)}" class="alert alert-info">
        You have not purchased any tickets yet. <a th:href="@{/events}" class="alert-link">Browse events now</a>.
    </div>

    <div class="table-responsive bg-white rounded shadow-sm p-3" th:if="${!#lists.isEmpty(tickets)}">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>Ticket #</th>
                <th>Event</th>
                <th>Venue</th>
                <th>Event Date</th>
                <th>Paid Amount</th>
                <th>Promo Used</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${tickets}">
                <td class="fw-bold">#<span th:text="${t.id}"></span></td>
                <td th:text="${t.event.title}"></td>
                <td th:text="${t.event.venue.name + ' (' + t.event.venue.city + ')'}"></td>
                <td th:text="${#temporals.format(t.event.eventDate, 'yyyy-MM-dd HH:mm')}"></td>
                <td class="fw-bold text-success">€<span th:text="${#numbers.formatDecimal(t.finalPrice, 1, 2)}"></span></td>
                <td>
                    <span class="badge bg-secondary" th:if="${t.promoCodeUsed != null}" th:text="${t.promoCodeUsed}"></span>
                    <span class="text-muted small" th:if="${t.promoCodeUsed == null}">None</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
