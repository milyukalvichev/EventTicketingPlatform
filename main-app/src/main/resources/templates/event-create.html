<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add New Event - EventPass</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-warning text-dark py-3">
          <h4 class="mb-0 fw-bold">Create New Event</h4>
        </div>
        <div class="card-body p-4">
          <form th:action="@{/events/create}" th:object="${eventCreateDTO}" method="post">
            <div class="mb-3">
              <label class="form-label fw-semibold">Event Title</label>
              <input type="text" th:field="*{title}" class="form-control" th:errorclass="is-invalid" placeholder="e.g., Summer Rock Fest">
              <div class="invalid-feedback" th:errors="*{title}"></div>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Base Price (€)</label>
                <input type="number" step="0.01" th:field="*{basePrice}" class="form-control" th:errorclass="is-invalid" placeholder="45.00">
                <div class="invalid-feedback" th:errors="*{basePrice}"></div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Event Date & Time</label>
                <input type="datetime-local" th:field="*{eventDate}" class="form-control" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{eventDate}"></div>
              </div>
            </div>

            <hr class="my-4">
            <h5 class="fw-bold text-dark mb-3">Venue Selection</h5>

            <div class="mb-3">
              <label class="form-label fw-semibold">Choose Existing Venue</label>
              <select th:field="*{venueId}" class="form-select">
                <option value="">-- Choose Existing Venue --</option>
                <option th:each="v : ${venues}" th:value="${v.id}" th:text="${v.name + ' (' + v.city + ')'}"></option>
              </select>
            </div>

            <div class="text-center text-muted fw-bold my-2">— OR TYPE NEW VENUE DETAILS —</div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Custom Venue Name</label>
              <input type="text" th:field="*{customVenueName}" class="form-control" placeholder="e.g., Arena Sofia">
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label fw-semibold">City</label>
                <input type="text" th:field="*{customVenueCity}" class="form-control" placeholder="e.g., Sofia">
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Capacity</label>
                <input type="number" th:field="*{customVenueCapacity}" class="form-control" placeholder="e.g., 10000">
              </div>
            </div>

            <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold">Publish Event</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
