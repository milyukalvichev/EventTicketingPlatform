<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${event.title + ' - EventPass'}">Event Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 overflow-hidden">
                <div class="card-header bg-dark text-white py-3 d-flex justify-content-between align-items-center">
                    <h3 class="mb-0 fw-bold" th:text="${event.title}">Event Title</h3>
                    <span class="badge bg-primary fs-6">€<span th:text="${#numbers.formatDecimal(event.basePrice, 1, 2)}"></span></span>
                </div>
                <div class="card-body p-4">
                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <h6 class="text-muted text-uppercase fw-bold">Date & Time</h6>
                            <p class="fs-5 fw-semibold mb-0">📅 <span th:text="${#temporals.format(event.eventDate, 'EEEE, MMMM dd, yyyy')}"></span></p>
                            <p class="text-muted">⏰ <span th:text="${#temporals.format(event.eventDate, 'HH:mm')}"></span> EEST</p>
                        </div>
                        <div class="col-md-6">
                            <h6 class="text-muted text-uppercase fw-bold">Venue & Capacity</h6>
                            <p class="fs-5 fw-semibold mb-0">📍 <span th:text="${event.venue.name}"></span></p>
                            <p class="text-muted">🌆 <span th:text="${event.venue.city}"></span> (Max capacity: <span th:text="${event.venue.capacity}"></span> attendees)</p>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                        <a th:href="@{/events}" class="btn btn-outline-secondary">← Back to Events</a>

                        <div class="d-flex gap-2">
                            <div sec:authorize="hasRole('ADMIN')" class="d-flex gap-2">
                                <a th:href="@{/events/edit/{id}(id=${event.id})}" class="btn btn-warning fw-semibold">Edit Event</a>
                                <form th:action="@{/events/delete/{id}(id=${event.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this event?');">
                                    <button type="submit" class="btn btn-outline-danger">Delete</button>
                                </form>
                            </div>
                            <a th:href="@{/tickets/checkout/{id}(id=${event.id})}" class="btn btn-success fw-bold px-4">Book Ticket</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
