<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Venue - EventPass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-warning text-dark py-3">
                    <h4 class="mb-0 fw-bold">Edit Venue Details</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/venues/edit/{id}(id=${venueId})}" th:object="${venueDTO}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Venue Name</label>
                            <input type="text" th:field="*{name}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">City</label>
                            <input type="text" th:field="*{city}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{city}"></div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Audience Capacity</label>
                            <input type="number" th:field="*{capacity}" class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{capacity}"></div>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/venues}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-warning fw-bold px-4">Update Venue</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
